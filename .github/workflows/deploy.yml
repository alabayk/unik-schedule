name: Deploy to alwaysdata

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Upload application over HTTPS WebDAV
        env:
          DAV_PASSWORD: ${{ secrets.AD_FTP_PASSWORD }}
        run: |
          base="https://webdav-vanchunik.alwaysdata.net"
          auth="vanchunik_deploy:${DAV_PASSWORD}"
          curl --silent --user "$auth" -X MKCOL "$base/static/" || true
          for file in application.py requirements.txt README.md static/index.html static/style.css static/sheet.css static/app.js static/manifest.webmanifest static/icon.svg static/exec-5fe81217-9624-47c1-b7b3-39e57179c4a1.png static/sw.js; do
            curl --fail --silent --show-error --user "$auth" --upload-file "$file" "$base/$file"
          done
